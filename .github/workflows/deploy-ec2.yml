name: Deploy MobiTrak Backend to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Deploy via SSH
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e

            APP_DIR=~/mobitrak-backend
            REPO_URL=${{ secrets.EC2_REPO_URL }}

            echo "==========================================="
            echo "  MobiTrak EC2 Deployment"
            echo "  $(date)"
            echo "==========================================="

            # --- Step 1: Clone or pull ---
            if [ ! -d "$APP_DIR" ]; then
                echo "[1/5] Cloning repository..."
                git clone "$REPO_URL" "$APP_DIR"
            else
                echo "[1/5] Pulling latest changes..."
                cd "$APP_DIR"
                git fetch --all
                git reset --hard origin/master
            fi

            cd "$APP_DIR"

            # --- Step 2: Install dependencies ---
            echo "[2/5] Installing dependencies..."
            npm install --production
            cd user-service && npm install --production && cd ..
            cd vehicle-service && npm install --production && cd ..
            cd driver-management-service && npm install --production && cd ..
            cd trip-service && npm install --production && cd ..

            # --- Step 3: Create logs directory ---
            echo "[3/5] Ensuring logs directory exists..."
            mkdir -p logs

            # --- Step 4: Restart services with PM2 ---
            echo "[4/5] Restarting services with PM2..."
            # Use reload for zero-downtime restart if processes are already running
            if pm2 list | grep -q "user-service"; then
                echo "  Services already running — performing graceful reload..."
                pm2 reload ecosystem.config.js --env production
            else
                echo "  Starting services for the first time..."
                pm2 start ecosystem.config.js --env production
            fi

            # --- Step 5: Save PM2 state ---
            echo "[5/5] Saving PM2 state..."
            pm2 save

            # --- Health check ---
            echo ""
            echo "Running health checks..."
            sleep 5

            check_health() {
                local name=$1
                local port=$2
                if curl -sf "http://localhost:$port/health" > /dev/null 2>&1; then
                    echo "  ✅ $name (port $port) — healthy"
                else
                    echo "  ❌ $name (port $port) — NOT responding"
                fi
            }

            check_health "User Service"    5001
            check_health "Vehicle Service"  5002
            check_health "Driver Service"   5003
            check_health "Trip Service"     5004

            echo ""
            echo "==========================================="
            echo "  Deployment complete!"
            echo "==========================================="
