# ========================================================
# MobiTrak Backend — Master Nginx Template
# ========================================================
# This file defines the server blocks and includes the proxy logic.
# After applying this, you only need to update mobitrak-proxy.conf 
# in your git repo to change routing or CORS.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream user_service { server 127.0.0.1:5001; keepalive 32; }
upstream vehicle_service { server 127.0.0.1:5002; keepalive 32; }
upstream driver_service { server 127.0.0.1:5003; keepalive 32; }
upstream trip_service { server 127.0.0.1:5004; keepalive 32; }

server {
    listen 80;
    server_name mobitrak.duckdns.org;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mobitrak.duckdns.org;

    # SSL configuration (Certbot will manage these)
    # If Certbot hasn't run yet, comment these out and run it.
    ssl_certificate /etc/letsencrypt/live/mobitrak.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobitrak.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 256;

    # INCLUDE THE PROXY LOGIC FROM THE GIT REPO
    # Update the path below to match your repo location on EC2
    include /home/ubuntu/mobitrak-backend/deployment/mobitrak-proxy.conf;
}
