# =============================================
# MobiTrak Backend — Nginx Reverse Proxy Config
# =============================================
#
# This file replaces AWS API Gateway for EC2 deployments.
# It routes requests to the correct microservice based on URL path.
#
# SETUP:
#   1. Copy this file to /etc/nginx/sites-available/mobitrak
#   2. Create symlink: sudo ln -s /etc/nginx/sites-available/mobitrak /etc/nginx/sites-enabled/
#   3. Remove default: sudo rm /etc/nginx/sites-enabled/default
#   4. Test config:    sudo nginx -t
#   5. Reload:         sudo systemctl reload nginx
#
# SSL (HTTPS):
#   Run: sudo certbot --nginx -d your-domain.com
#   Certbot will automatically modify this file to add SSL blocks.
#

# Rate limiting zone (optional — protects against abuse)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream user_service {
    server 127.0.0.1:5001;
    keepalive 32;
}

upstream vehicle_service {
    server 127.0.0.1:5002;
    keepalive 32;
}

upstream driver_service {
    server 127.0.0.1:5003;
    keepalive 32;
}

upstream trip_service {
    server 127.0.0.1:5004;
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # Replace with your domain or Elastic IP

    # Max upload size (for vehicle RC images, profile photos, etc.)
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 256;

    # Common proxy headers (reused via include-like pattern)
    # These ensure the backend services see the real client IP and protocol.

    # ===== User Service Routes =====
    # Handles: /api/users/*, /api/admin/*, /health
    location /api/users {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /api/admin {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ===== Vehicle Service Routes =====
    # Handles: /api/vehicles/*, /api/maintenance/*
    # Note: /api/vehicles/tracking-device/* is nested under /api/vehicles
    # in the Express app, so this single location block covers it.
    location /api/vehicles {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://vehicle_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;  # Longer timeout for RC image upload + OCR
    }

    location /api/tracking-device {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://vehicle_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /api/maintenance {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://vehicle_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ===== Driver Management Service Routes =====
    # Handles: /api/drivers/*
    location /api/drivers {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://driver_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ===== Trip Service Routes =====
    # Handles: /api/trips/*, /api/realtime/*, /api/alerts
    location /api/trips {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://trip_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /api/realtime {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://trip_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /api/alerts {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://trip_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # ===== Socket.IO (WebSocket upgrade for real-time) =====
    # Trip service runs Socket.IO for driver monitoring, WebRTC signaling,
    # and fleet tracking. Nginx must handle the WebSocket upgrade.
    location /socket.io {
        proxy_pass http://trip_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket connections are long-lived — increase timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ===== Health Check =====
    # Returns 200 OK from Nginx itself — useful for load balancers, uptime monitors.
    location = /health {
        proxy_pass http://user_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ===== Default — 404 =====
    location / {
        return 404 '{"error":"Route not found","hint":"All API routes start with /api/"}';
        add_header Content-Type application/json always;
    }
}
